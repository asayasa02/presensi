<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#4f46e5">
    <title>Profil - Absensi Guru</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="guru-page">
    <header class="page-header">
        <a href="home.html" class="btn-back">
            <i class="fas fa-arrow-left"></i>
        </a>
        <h1>Profil</h1>
        <div style="width: 44px;"></div>
    </header>
    
    <main class="page-content has-bottom-nav">
        <div class="profile-card">
            <div class="profile-avatar" id="profileAvatar"></div>
            <h2 id="profileName"></h2>
            <p id="profileNIP"></p>
            <span class="badge badge-primary" id="profileMapel"></span>
        </div>
        
        <div class="card">
            <div class="info-list">
                <div class="info-item">
                    <div class="info-icon">
                        <i class="fas fa-envelope"></i>
                    </div>
                    <div class="info-content">
                        <span class="info-label">Email</span>
                        <span class="info-value" id="profileEmail"></span>
                    </div>
                </div>
                <div class="info-item">
                    <div class="info-icon">
                        <i class="fas fa-phone"></i>
                    </div>
                    <div class="info-content">
                        <span class="info-label">Telepon</span>
                        <span class="info-value" id="profilePhone"></span>
                    </div>
                </div>
                <div class="info-item">
                    <div class="info-icon">
                        <i class="fas fa-id-card"></i>
                    </div>
                    <div class="info-content">
                        <span class="info-label">NIP</span>
                        <span class="info-value" id="profileNIPFull"></span>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="card">
            <div class="menu-list">
                <a href="#" class="menu-item" id="btnEditProfile">
                    <div class="menu-icon">
                        <i class="fas fa-user-edit"></i>
                    </div>
                    <span>Edit Profil</span>
                    <i class="fas fa-chevron-right"></i>
                </a>
                <a href="#" class="menu-item" id="btnChangePassword">
                    <div class="menu-icon">
                        <i class="fas fa-lock"></i>
                    </div>
                    <span>Ganti Password</span>
                    <i class="fas fa-chevron-right"></i>
                </a>
                <a href="#" class="menu-item" id="btnAbout">
                    <div class="menu-icon">
                        <i class="fas fa-info-circle"></i>
                    </div>
                    <span>Tentang Aplikasi</span>
                    <i class="fas fa-chevron-right"></i>
                </a>
            </div>
        </div>
    </main>
    
    <nav class="bottom-nav">
        <a href="home.html" class="nav-item">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
        <a href="riwayat.html" class="nav-item">
            <i class="fas fa-history"></i>
            <span>Riwayat</span>
        </a>
        <a href="profil.html" class="nav-item active">
            <i class="fas fa-user"></i>
            <span>Profil</span>
        </a>
        <a href="#" class="nav-item" id="btnLogout">
            <i class="fas fa-sign-out-alt"></i>
            <span>Keluar</span>
        </a>
    </nav>
    
    <div class="modal-overlay" id="modalPassword">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Ganti Password</h3>
                <button class="modal-close" id="closeModal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form id="passwordForm">
                <div class="modal-body">
                    <div class="form-group">
                        <label class="form-label">Password Lama</label>
                        <input type="password" id="oldPassword" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Password Baru</label>
                        <input type="password" id="newPassword" class="form-input" required minlength="6">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Konfirmasi Password</label>
                        <input type="password" id="confirmPassword" class="form-input" required>
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-ghost" id="cancelPassword">Batal</button>
                    <button type="submit" class="btn btn-primary">Simpan</button>
                </div>
            </form>
        </div>
    </div>
    
    <script src="../js/storage.js"></script>
    <script src="../js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const session = getSession();
            if (!session || session.role !== 'guru') {
                window.location.href = '../login.html';
                return;
            }
            
            const user = getUserById(session.id);
            if (!user) {
                clearSession();
                window.location.href = '../login.html';
                return;
            }
            
            // Set profile info
            const initial = getInitials(user.nama);
            document.getElementById('profileAvatar').textContent = initial;
            document.getElementById('profileName').textContent = user.nama;
            document.getElementById('profileNIP').textContent = 'NIP: ' + user.nip;
            document.getElementById('profileMapel').textContent = user.mapel;
            document.getElementById('profileEmail').textContent = user.email;
            document.getElementById('profilePhone').textContent = user.telepon || '-';
            document.getElementById('profileNIPFull').textContent = user.nip;
            
            // Edit profile
            document.getElementById('btnEditProfile').addEventListener('click', function(e) {
                e.preventDefault();
                Swal.fire({
                    title: 'Edit Profil',
                    html: `
                        <input id="swal-nama" class="swal2-input" placeholder="Nama" value="${user.nama}">
                        <input id="swal-telepon" class="swal2-input" placeholder="Telepon" value="${user.telepon || ''}">
                    `,
                    showCancelButton: true,
                    confirmButtonText: 'Simpan',
                    cancelButtonText: 'Batal',
                    preConfirm: () => {
                        const nama = document.getElementById('swal-nama').value;
                        const telepon = document.getElementById('swal-telepon').value;
                        
                        if (!nama) {
                            Swal.showValidationMessage('Nama tidak boleh kosong');
                            return false;
                        }
                        
                        return { nama, telepon };
                    }
                }).then((result) => {
                    if (result.isConfirmed) {
                        updateUser(user.id, {
                            nama: result.value.nama,
                            telepon: result.value.telepon
                        });
                        
                        Swal.fire('Berhasil!', 'Profil berhasil diperbarui.', 'success')
                            .then(() => location.reload());
                    }
                });
            });
            
            // Change password modal
            const modal = document.getElementById('modalPassword');
            
            document.getElementById('btnChangePassword').addEventListener('click', function(e) {
                e.preventDefault();
                modal.classList.add('show');
            });
            
            document.getElementById('closeModal').addEventListener('click', () => modal.classList.remove('show'));
            document.getElementById('cancelPassword').addEventListener('click', () => modal.classList.remove('show'));
            modal.addEventListener('click', (e) => {
                if (e.target === modal) modal.classList.remove('show');
            });
            
            // Password form
            document.getElementById('passwordForm').addEventListener('submit', function(e) {
                e.preventDefault();
                
                const oldPassword = document.getElementById('oldPassword').value;
                const newPassword = document.getElementById('newPassword').value;
                const confirmPassword = document.getElementById('confirmPassword').value;
                
                if (oldPassword !== user.password) {
                    Swal.fire('Error', 'Password lama salah!', 'error');
                    return;
                }
                
                if (newPassword !== confirmPassword) {
                    Swal.fire('Error', 'Konfirmasi password tidak cocok!', 'error');
                    return;
                }
                
                if (newPassword.length < 6) {
                    Swal.fire('Error', 'Password minimal 6 karakter!', 'error');
                    return;
                }
                
                updateUser(user.id, { password: newPassword });
                
                modal.classList.remove('show');
                this.reset();
                
                Swal.fire('Berhasil!', 'Password berhasil diperbarui.', 'success');
            });
            
            // About
            document.getElementById('btnAbout').addEventListener('click', function(e) {
                e.preventDefault();
                const settings = getSettings();
                Swal.fire({
                    title: 'Absensi Guru',
                    html: `
                        <p><strong>Versi 1.0.0</strong></p>
                        <p>Aplikasi Presensi Guru Online</p>
                        <p class="text-muted">© 2025 ${settings.nama_sekolah || 'SMP Negeri 1 Contoh'}</p>
                    `,
                    icon: 'info'
                });
            });
            
            // Logout
            document.getElementById('btnLogout').addEventListener('click', function(e) {
                e.preventDefault();
                Swal.fire({
                    title: 'Logout?',
                    text: 'Apakah Anda yakin ingin keluar?',
                    icon: 'question',
                    showCancelButton: true,
                    confirmButtonColor: '#ef4444',
                    cancelButtonColor: '#6b7280',
                    confirmButtonText: 'Ya, Keluar',
                    cancelButtonText: 'Batal'
                }).then((result) => {
                    if (result.isConfirmed) {
                        clearSession();
                        window.location.href = '../login.html';
                    }
                });
            });
        });
    </script>
</body>
</html>
